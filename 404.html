<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AI Benchbase</title>
    <script type="text/javascript">
      // 单页应用路由修复
      // 当直接访问子路由时，GitHub Pages会返回404.html
      // 我们需要重定向到index.html并保持URL不变
      var path = window.location.pathname.replace('/ai-benchbase', '');
      var hash = window.location.search;
      var newUrl = '/ai-benchbase/#' + path + hash;
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
    <!-- 重定向中... -->
  </body>
</html>
